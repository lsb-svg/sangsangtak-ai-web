name: SEO Content Registry Auto-Sync

on:
  workflow_run:
    workflows: ["Daily QA Auto Publisher (Simulation & Verification)"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode (do not commit or save)'
        required: true
        type: boolean
        default: false

# github-pages concurrency와 충돌하지 않는 독립적인 동시성 제어
concurrency:
  group: seo-registry-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-registry:
    # 1. workflow_run이 성공(success)으로 완료되었을 때만 실행 (실패/취소 시 실행 금지)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (latest origin/main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull latest changes from origin/main
        run: |
          git pull --ff-only origin main

      - name: Verify Live Deployment Propagation
        if: github.event_name == 'workflow_run'
        run: |
          echo "Checking live sitemap propagation (waiting up to 180s)..."
          python - << 'EOF'
          import urllib.request, time, sys
          url = "https://lsb-svg.github.io/sangsangtak-ai-web/sitemap.xml"
          for attempt in range(18):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Registry-Sync-Wait/1.0'})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      if resp.status == 200:
                          print(f"[OK] Live sitemap accessible (attempt {attempt + 1})")
                          sys.exit(0)
              except Exception as e:
                  print(f"[WAIT] Waiting for Pages CDN propagation ({attempt + 1}/18): {e}")
                  time.sleep(10)
          print("[WARN] Sitemap check timed out, proceeding with update script network verification.")
          EOF

      - name: Run SEO Content Registry Update (Network Verified)
        id: sync
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/update_seo_registry.py --dry-run
          else
            python scripts/update_seo_registry.py
          fi

      - name: Check for Registry Changes
        id: git-check
        run: |
          git status --porcelain reports/seo_registry/seo_content_registry.csv reports/seo_registry/seo_content_registry.json
          if [ -n "$(git status --porcelain reports/seo_registry/seo_content_registry.csv reports/seo_registry/seo_content_registry.json)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Registry Changes safely
        if: steps.git-check.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only explicitly add the two target production registry files
          git add reports/seo_registry/seo_content_registry.csv reports/seo_registry/seo_content_registry.json
          git commit -m "chore(seo): sync seo content registry with live deployment [skip ci]"
          
          # Safe pull before push to avoid non-fast-forward conflict; NEVER force push
          git pull --rebase origin main || {
            echo "[ERROR] Git pull conflict detected. Aborting push to protect remote registry and manual audit logs."
            exit 1
          }
          git push origin main
