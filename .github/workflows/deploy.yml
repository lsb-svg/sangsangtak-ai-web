name: Build and publish SangsangTak AI info site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * 1,4'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and verify
        env:
          PUBLIC_URL: https://lsb-svg.github.io/sangsangtak-ai-web/
        run: |
          python build.py
          python verify.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
